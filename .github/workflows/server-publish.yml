name: Publish server image

# On main: conventional-commits release for `packages/server`. Computes
# server-v* tag, builds + pushes the image to GHCR, runs Drizzle migrations
# against the prod Neon DB, then submits MsgUpdateDeployment to rebind the
# existing Akash lease to the new tag (preserving the ingress URL).
#
# On PRs: build only, no push, no migrate, no rebind.

on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'packages/releaser/**'
      - 'deploy/server.sdl.yaml'
      - '.github/workflows/server-publish.yml'
  pull_request:
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'packages/releaser/**'
      - 'deploy/server.sdl.yaml'
      - '.github/workflows/server-publish.yml'
  workflow_dispatch:
  # Auto-fires when runner-publish completes on main so prod's pinned
  # RUNNER_IMAGE picks up newly-released runner tags without a server commit.
  # workflow_run lets the default GITHUB_TOKEN chain workflows;
  # repository_dispatch would require a PAT.
  workflow_run:
    workflows: ['Publish runner image']
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/baktun14/akash-functions-server

jobs:
  guard_runner_released:
    name: Was a runner release cut
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # runner-publish uploads a `runner-released` artifact only when it
          # actually cut a new release. Absent = no-release run (e.g. docs
          # touch in packages/runner/), nothing to rebind.
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "runner-released")] | length')
          if [ "$count" -gt 0 ]; then
            echo "Runner release detected; will rebind"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release artifact; skipping rebind"
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Compute next version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install releaser deps
        run: npm install --workspace packages/releaser --no-audit --no-fund

      - name: Compute next version from conventional commits
        id: bump
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          analysis=$(node ./packages/releaser/recommended-bump.js \
            --tag-prefix=server-v \
            --path packages/server \
            --repo-url "https://github.com/$GITHUB_REPOSITORY" \
            --target-sha "$TARGET_SHA")
          echo "$analysis" | jq

          err=$(echo "$analysis" | jq -r '.error // empty')
          if [ -n "$err" ]; then
            echo "No releasable change: $err"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(echo "$analysis" | jq -r '.nextVersion')
          tag=$(echo "$analysis" | jq -r '.nextTag')
          changelog=$(echo "$analysis" | jq -r '.changelog')

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$changelog"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.bump.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
          RELEASE_CHANGELOG: ${{ steps.bump.outputs.changelog }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "$RELEASE_CHANGELOG"

  build:
    name: Build server image
    runs-on: ubuntu-latest
    needs: [release]
    # Skip on runner-released triggers — we're only rebinding the existing
    # server image with a new SDL (new RUNNER_IMAGE), not rebuilding it.
    if: |
      always() &&
      github.event_name != 'workflow_run' &&
      (needs.release.result == 'skipped' ||
       needs.release.result == 'success')
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.version != '' }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate-and-rebind:
    name: Migrate Neon + rebind Akash
    needs: [release, build, guard_runner_released]
    # Rebind on every push to main — even when no new version was cut
    # (e.g. SDL-only changes). In that case `Resolve rebind tag` falls back
    # to the most recent server-v* release so we still ship the new SDL.
    # Also runs when runner-publish completes successfully on main AND
    # actually cut a new release (guarded by the runner-released artifact)
    # so prod picks up new runner tags without a server commit. The build
    # job is skipped on that path.
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        needs.guard_runner_released.outputs.released == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Resolve rebind tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -n "$NEW_VERSION" ]; then
            echo "Using newly-cut version: $NEW_VERSION"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(gh release list --limit 50 --json tagName --jq \
            '[.[] | select(.tagName | startswith("server-v"))][0].tagName' \
            | sed 's/^server-v//')
          if [ -z "$latest" ]; then
            echo "::error::No server-v* release exists yet — cannot rebind"
            exit 1
          fi
          echo "No new release this push; rebinding latest server-v$latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Resolve runner image
        id: runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release list --limit 50 --json tagName --jq \
            '[.[] | select(.tagName | startswith("runner-v"))][0].tagName' \
            | sed 's/^runner-v//')
          if [ -z "$tag" ]; then
            echo "::error::No runner-v* release exists yet — cannot rebind"
            exit 1
          fi
          image="ghcr.io/baktun14/akash-functions-runner:$tag"
          echo "Resolved runner image: $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Resolve python runner image
        id: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release list --limit 50 --json tagName --jq \
            '[.[] | select(.tagName | startswith("pyrunner-v"))][0].tagName' \
            | sed 's/^pyrunner-v//')
          if [ -z "$tag" ]; then
            echo "::error::No pyrunner-v* release exists yet — cannot rebind"
            exit 1
          fi
          image="ghcr.io/baktun14/akash-functions-python-runner:$tag"
          echo "Resolved python runner image: $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Migrate Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npm run db:migrate -w server

      - name: Rebind Akash deployment
        env:
          AKASH_API_KEY: ${{ secrets.AKASH_API_KEY }}
          PROD_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          PROD_MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
          PROD_CODE_SIGNING_SECRET: ${{ secrets.CODE_SIGNING_SECRET }}
          PROD_CODE_HOST_BASE: ${{ vars.PROD_API_BASE }}
          PROD_RUNNER_IMAGE: ${{ steps.runner.outputs.image }}
          PROD_PYTHON_RUNNER_IMAGE: ${{ steps.python.outputs.image }}
        run: |
          npm run rebind-prod -w server -- \
            --target=server \
            --tag=${{ steps.tag.outputs.version }} \
            --dseq=${{ secrets.AKASH_SERVER_DSEQ }}
