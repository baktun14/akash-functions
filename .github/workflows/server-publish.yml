name: Publish server image

# On main: conventional-commits release for `packages/server`. Computes
# server-v* tag, builds + pushes the image to GHCR, runs Drizzle migrations
# against the prod Neon DB, then submits MsgUpdateDeployment to rebind the
# existing Akash lease to the new tag (preserving the ingress URL).
#
# On PRs: build only, no push, no migrate, no rebind.

on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'packages/releaser/**'
      - 'deploy/server.sdl.yaml'
      - '.github/workflows/server-publish.yml'
  pull_request:
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'packages/releaser/**'
      - 'deploy/server.sdl.yaml'
      - '.github/workflows/server-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/baktun14/akash-functions-server

jobs:
  release:
    name: Compute next version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install releaser deps
        run: npm install --workspace packages/releaser --no-audit --no-fund

      - name: Compute next version from conventional commits
        id: bump
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          analysis=$(node ./packages/releaser/recommended-bump.js \
            --tag-prefix=server-v \
            --path packages/server \
            --repo-url "https://github.com/$GITHUB_REPOSITORY" \
            --target-sha "$TARGET_SHA")
          echo "$analysis" | jq

          err=$(echo "$analysis" | jq -r '.error // empty')
          if [ -n "$err" ]; then
            echo "No releasable change: $err"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(echo "$analysis" | jq -r '.nextVersion')
          tag=$(echo "$analysis" | jq -r '.nextTag')
          changelog=$(echo "$analysis" | jq -r '.changelog')

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$changelog"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.bump.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
          RELEASE_CHANGELOG: ${{ steps.bump.outputs.changelog }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "$RELEASE_CHANGELOG"

  build:
    name: Build server image
    runs-on: ubuntu-latest
    needs: [release]
    if: |
      always() &&
      (needs.release.result == 'skipped' ||
       needs.release.result == 'success')
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.version != '' }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate-and-rebind:
    name: Migrate Neon + rebind Akash
    needs: [release, build]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Migrate Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npm run db:migrate -w server

      - name: Rebind Akash deployment
        env:
          AKASH_API_KEY: ${{ secrets.AKASH_API_KEY }}
          PROD_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          PROD_MASTER_ENCRYPTION_KEY: ${{ secrets.MASTER_ENCRYPTION_KEY }}
          PROD_CODE_SIGNING_SECRET: ${{ secrets.CODE_SIGNING_SECRET }}
          PROD_CODE_HOST_BASE: ${{ vars.PROD_API_BASE }}
        run: |
          npm run rebind-prod -w server -- \
            --target=server \
            --tag=${{ needs.release.outputs.version }} \
            --dseq=${{ secrets.AKASH_SERVER_DSEQ }}
