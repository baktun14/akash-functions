server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed asset bundles — Vite emits content-hashed filenames, so it's safe
  # to tell browsers (and any CDN in front) to cache them forever.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: every non-asset path falls back to index.html so React Router can
  # handle deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
