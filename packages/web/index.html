<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akash Functions</title>
    <meta name="description" content="Describe a function. Deploy on Akash." />
    <script>
      // Apply theme before paint to avoid a flash. Mirrors lib/theme.tsx.
      (function () {
        try {
          var saved = localStorage.getItem('akash-fn-theme');
          var pref = saved === 'light' || saved === 'dark' ? saved : 'system';
          var resolved =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref;
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
